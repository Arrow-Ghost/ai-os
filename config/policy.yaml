# =====================================================================
#  Owner policy. YOU edit this file. The agent only ever reads it.
#
#  Anything you leave out falls back to DEFAULT_POLICY in servant/config.py.
#  Changing a rule here takes effect on the next run -- the agent has no
#  mechanism to preserve an old policy against your edit, and that is
#  deliberate. Correctability beats goal-content integrity.
# =====================================================================

brain:
  # "auto"    groq when GROQ_API_KEY / GROQ_API_KEYS is set in .env, offline otherwise
  # "groq"    always groq; fails at startup without a key
  # "offline" never calls a network; scripted answers only (what tests use)
  provider: auto
  base_url: https://api.groq.com/openai/v1
  model_fast: openai/gpt-oss-20b      # routing, classification, short steps
  model_smart: openai/gpt-oss-120b    # planning and anything that needs care
  model_vision: qwen/qwen3.8-27b      # screen.describe -- verified live on Groq
  model_transcribe: whisper-large-v3-turbo   # speech.transcribe, hosted
  temperature: 0.2
  max_retries: 3                      # Groq rate-limits hard; we back off
  max_image_bytes: 4000000            # refuse bigger screenshots; downscale first

  # Local fallback via Ollama. "auto" (default) only wires it in if Ollama is
  # actually reachable at startup -- a laptop without it installed behaves
  # exactly as before. Set to true/false to force it either way.
  # Text-only: no vision or audio locally (see LocalBrain in brain.py).
  local_fallback: auto
  local_base_url: http://localhost:11434/v1
  local_model: qwen2.5:7b-instruct             # chosen after live testing -- see
                                       # docs/ARCHITECTURE.md for why

governance:
  # What happens for each tier. auto | approve | block
  tier_policy:
    read: auto
    write: auto
    danger: approve
    forbidden: block

  # Force a specific tool to a tier, whatever its author declared.
  # Your override always wins. Examples:
  #   files.trash: danger
  #   notes.save: approve      # <- not a tier; use a tier name here
  tier_overrides: {}

  # Tools that must never run, by name. Highest priority of all.
  denylist: []

  # Tools that ask even when their tier would otherwise run automatically.
  # This survives full access.
  always_ask:
    - skill.install

  # Code the agent WROTE FOR ITSELF always asks before it runs, whatever the
  # tier policy says. This closes the one compound risk in full-access mode:
  # writing a tool and running it in the same turn, without a human ever
  # seeing the code.
  #
  # Set this to false only if you have decided you do not need to see what
  # the agent writes before it runs. It is the single most consequential
  # switch in this file.
  generated_code_always_asks: true

  # Even an "auto" tier asks for a human below this confidence.
  confidence_floor: 0.35

  killswitch_file: .servant/STOP

budgets:
  max_steps: 12          # tool calls in one run
  max_llm_calls: 20      # brain turns in one run
  max_seconds: 300
  max_spend_usd: 0.0     # hard zero. The agent never spends money. Ever.

skills:
  # The agent may write NEW TOOLS for itself. It may not modify its own core,
  # its governance layer, or this file.
  enabled: true

  # Generated tools are pinned to this tier, so anything the agent taught
  # itself asks you before it runs. The validator rejects generated code that
  # declares a lower tier -- it cannot grant itself permission.
  #
  # Once you have read a generated tool and trust it, lower it BY NAME in
  # governance.tier_overrides above. Do not lower this floor.
  tier_floor: danger

  max_attempts: 3          # redraft this many times on validation/test failure
  sandbox_timeout: 20      # seconds before a draft is killed
  sandbox_memory_mb: 512

redaction:
  enabled: true
  patterns:
    - 'sk-[A-Za-z0-9_\-]{16,}'
    - 'gsk_[A-Za-z0-9_\-]{16,}'
    - 'AKIA[0-9A-Z]{16}'
    # Gmail app password: 16 lowercase letters, usually shown in 4 groups.
    # Anchored on a nearby keyword so ordinary four-word prose survives.
    - '(?i)\b(?:app[ -]?password|gmail|smtp|imap)\b[^\n]{0,30}?\b[a-z]{4} ?[a-z]{4} ?[a-z]{4} ?[a-z]{4}\b'
    - 'ghp_[A-Za-z0-9]{36}'
    - '(?i)\b(api[_-]?key|secret|password|passwd|token)\b\s*[:=]\s*\S+'
  forbidden_paths:
    - ~/.ssh
    - ~/.aws
    - ~/.gnupg
    - .env

# Settings individual features read. Still yours: the agent never writes them.
features:
  shell:
    # The ONLY commands shell.run may execute (it still asks you every time).
    # Each entry is a token prefix: "git status" allows `git status -s` but
    # not `git push`. Never add a bare interpreter ("python", "node", "bash",
    # "powershell") -- that allows any code at all via -c / -e.
    allowlist:
      - git status
      - git log
      - git diff
      - python --version
      - py --version
      - pytest
      - npm test
      - npm run test
      - npm run lint
      - node --version
    max_output_chars: 4000
  code:
    # code.apply_patch refuses to run while one of these is checked out.
    protected_branches: [main, master]

paths:
  state_dir: .servant
  audit_log: .servant/audit.jsonl
  memory_db: .servant/memory.db
  features_dir: features
